<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay — overreaching radar</title>

    <!-- Search/share metadata for the SPA shell. Only meaningful for the
         handful of routes actually indexable (see public/robots.txt) --
         every other route sits behind client-side auth, so a search
         result or link preview for one of those would only ever resolve
         to a login wall, not real content. The description text below
         is copied verbatim from Home.tsx's own hero copy, not written
         fresh here, so search snippets and the actual landing page never
         say two different things about what this app is. -->
    <meta
      name="description"
      content="Relay catches overtraining before it becomes an injury — turning a daily check-in and logged runs into one honest signal for the coach of a high school track or cross country team."
    />
    <link rel="canonical" href="https://relaycoach.app/" />

    <!-- Open Graph: how a shared link previews in iMessage/Slack/social. -->
    <meta property="og:title" content="Relay — overreaching radar" />
    <meta
      property="og:description"
      content="Relay catches overtraining before it becomes an injury — turning a daily check-in and logged runs into one honest signal for the coach of a high school track or cross country team."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://relaycoach.app/" />
    <!-- icon-512.png is a square app icon, not a proper 1200x630 social
         card -- good enough for launch; a real OG image is a nice-to-have,
         not a blocker. -->
    <meta property="og:image" content="https://relaycoach.app/icon-512.png" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Relay — overreaching radar" />
    <meta
      name="twitter:description"
      content="Relay catches overtraining before it becomes an injury — turning a daily check-in and logged runs into one honest signal for the coach of a high school track or cross country team."
    />
    <meta name="twitter:image" content="https://relaycoach.app/icon-512.png" />

    <!-- PNG only -- there's no vector source for this logo (the real
         artwork is a photo/export, see public/logo-source.jpg), so every
         icon reference in this app is a raster derivative of it rather
         than a hand-drawn SVG recreation. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS ignores the manifest's own icon list -- this is the one it
         actually uses for the home-screen icon, and must be a plain
         square PNG (no baked-in rounding -- iOS applies its own mask). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0e16" />
    <!-- Installed-to-home-screen Safari: runs full-screen with no
         browser chrome, and "black-translucent" lets the app's own dark
         background show through the status bar instead of a jarring
         white/default bar. Android reads theme_color from the manifest
         instead -- these two are the iOS-specific half of "add to home
         screen" support (see README's PWA section for why iOS needs a
         real install to even receive push notifications). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Relay" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
