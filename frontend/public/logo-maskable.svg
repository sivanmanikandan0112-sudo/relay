<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="55%" stop-color="#0a0e16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>
    <linearGradient id="signal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e07d4a" />
      <stop offset="55%" stop-color="#e0b048" />
      <stop offset="100%" stop-color="#8fc0e8" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glow-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <g id="runner-template">
      <circle cx="4" cy="-66" r="13" fill="#eef2f7" />
      <g stroke="#eef2f7" stroke-width="15" stroke-linecap="round" fill="none">
        <line x1="2" y1="-52" x2="0" y2="0" />
        <line x1="0" y1="0" x2="20" y2="-16" />
        <line x1="20" y1="-16" x2="10" y2="14" />
        <line x1="0" y1="0" x2="-16" y2="20" />
        <line x1="-16" y1="20" x2="-32" y2="40" />
        <line x1="2" y1="-52" x2="24" y2="-40" />
        <line x1="24" y1="-40" x2="34" y2="-16" />
        <line x1="2" y1="-52" x2="-16" y2="-38" />
        <line x1="-16" y1="-38" x2="-26" y2="-16" />
      </g>
      <g fill="#eef2f7">
        <circle cx="2" cy="-52" r="7.5" />
        <circle cx="0" cy="0" r="7.5" />
        <circle cx="20" cy="-16" r="6.5" />
        <circle cx="-16" cy="20" r="6.5" />
        <circle cx="24" cy="-40" r="6" />
        <circle cx="-16" cy="-38" r="6" />
      </g>
    </g>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg)" />

  <g transform="translate(88,88) scale(0.7)">
    <g transform="translate(-50,30)">
      <g transform="translate(26,-41)">
        <rect x="66" y="106" width="380" height="300" rx="150" fill="none" stroke="#3a4d70" stroke-width="20" filter="url(#glow-soft)" />
        <polyline points="112,332 186,300 232,362 300,206 356,244 404,190" fill="none" stroke="url(#signal)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
        <rect x="404" y="226" width="14" height="60" fill="#e0b048" filter="url(#glow-soft)" />
        <path d="M 416 210 L 486 256 L 416 302 Z" fill="#e07d4a" filter="url(#glow)" />
        <use href="#runner-template" transform="translate(168,300) scale(0.9)" />
        <use href="#runner-template" transform="translate(252,300) scale(0.9)" />
      </g>
    </g>
  </g>
</svg>
